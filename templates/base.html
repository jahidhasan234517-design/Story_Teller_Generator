{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}News Intelligence Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-wrap">
                <div class="brand-mark">N</div>
                <div>
                    <div class="brand-title">NewsIQ</div>
                    <div class="brand-subtitle">Intelligence</div>
                </div>
            </div>
            <nav class="side-nav">
                <a href="{% url 'dashboard' %}" class="nav-item {% if active_section == 'dashboard' %}active{% endif %}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a href="{% url 'news_list' %}" class="nav-item {% if active_section == 'news' %}active{% endif %}"><i class="bi bi-newspaper"></i> Latest News</a>
                <a href="{% url 'trending' %}" class="nav-item {% if active_section == 'trending' %}active{% endif %}"><i class="bi bi-graph-up-arrow"></i> Trending</a>
                <a href="{% url 'topics' %}" class="nav-item {% if active_section == 'topics' %}active{% endif %}"><i class="bi bi-tags"></i> Topics</a>
                <a href="{% url 'analytics' %}" class="nav-item {% if active_section == 'analytics' %}active{% endif %}"><i class="bi bi-bar-chart"></i> Analytics</a>
                <a href="{% url 'bookmarks' %}" class="nav-item {% if active_section == 'bookmarks' %}active{% endif %}"><i class="bi bi-bookmark-star"></i> Bookmarks</a>
                <a href="{% url 'about' %}" class="nav-item {% if active_section == 'about' %}active{% endif %}"><i class="bi bi-info-circle"></i> About</a>
            </nav>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" type="button">☰</button>
                    <form class="search-form" method="get" action="{% url 'news_list' %}">
                        <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Search News...">
                        <button type="submit"><i class="bi bi-search"></i></button>
                    </form>
                </div>
                <div class="topbar-right">
                    <a class="btn btn-outline-primary refresh-btn" href="{% url 'refresh_news' %}">Refresh News</a>
                    <button class="theme-toggle" type="button" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>
                </div>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
