services:
  - type: web
    name: news-intelligence-dashboard
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn news_intelligence.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
